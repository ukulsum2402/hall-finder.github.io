<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mysore Events</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="login-body">

    <div id="login-page" class="page active">
        <div class="login-card">
            <h2>Welcome to Mysore Events</h2>
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" placeholder="user" required>
                </div>
                <div class="input-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" placeholder="pass" required>
                </div>
                <button type="submit" class="btn primary-btn">Login</button>
            </form>
            <p class="footnote">Use username: **user** and password: **pass** to log in.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
