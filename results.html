<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results | Mysore Events</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <nav id="navbar">
        <div class="logo">Mysore Events</div>
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="book.html" class="active-link">Book Hall</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
    </nav>

    <div id="results-page" class="page active">
        <button class="btn back-btn" onclick="window.location.href='book.html'">← Change Search</button>
        
        <h2 style="color: var(--secondary-color); margin-bottom: 30px; font-size: 1.8em;">
            Found Halls for <span id="results-type">...</span> in <span id="results-location">...</span>
        </h2>
        
        <div id="halls-list" class="hall-grid">
            <p>Loading results...</p>
        </div>
    </div>
    
    <footer id="footer">
        <div class="footer-content">
            <div class="footer-contact-info">
                <p>Email: support@mysoreevents.com</p>
                <p>Phone: (0821) 123-4567</p>
            </div>
            <div class="footer-links">
                <a href="home.html">Home</a> | 
                <a href="book.html">Book Hall</a> | 
                <a href="contact.html">Contact Us</a>
            </div>
            <div class="footer-socials">
                <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
        <p style="margin-top: 15px;">&copy; 2024 Mysore Events. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
