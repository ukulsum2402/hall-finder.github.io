<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Hall | Mysore Events</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <nav id="navbar">
        <div class="logo">Mysore Events</div>
        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="book.html" class="active-link">Book Hall</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
    </nav>

    <div id="booking-search-page" class="page active">
        <div class="search-card">
            <h2>Find Your Perfect Event Hall</h2>
            <form id="booking-search-form">
                
                <div class="input-group">
                    <label for="hall-type">Type of Hall:</label>
                    <select id="hall-type" name="hall-type" required>
                        <option value="">-- Select Event Type --</option>
                        <option value="engagement">Engagement Hall</option>
                        <option value="marriage">Marriage Hall</option>
                        <option value="party">Party Hall (Birthday/Anniversary)</option>
                        <option value="conference">Conference Hall</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="capacity">Capacity (Approx. Guests):</label>
                    <select id="capacity" name="capacity" required>
                        <option value="">-- Select Capacity Range --</option>
                        <option value="0-100">0 - 100 Guests</option>
                        <option value="100-200">100 - 200 Guests</option>
                        <option value="200-300">200 - 300 Guests</option>
                        <option value="300-400">300 - 400 Guests</option>
                        <option value="400-500">400 - 500 Guests</option>
                        <option value="500+">500+ Guests</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="location">Location / Area:</label>
                    <select id="location" name="location" required>
                        <option value="">-- Select Location --</option>
                        <option value="rajivnagar">Rajivnagar</option>
                        <option value="bannimantap">Bannimantap</option>
                        <option value="udayagiri">Udayagiri</option>
                    </select>
                </div>

                <button type="submit" class="btn primary-btn">Search Halls</button>
            </form>
        </div>
    </div>
    
    <footer id="footer">
        <div class="footer-content">
            <div class="footer-contact-info">
                <p>Email: support@mysoreevents.com</p>
                <p>Phone: (0821) 123-4567</p>
            </div>
            <div class="footer-links">
                <a href="home.html">Home</a> | 
                <a href="book.html">Book Hall</a> | 
                <a href="contact.html">Contact Us</a>
            </div>
            <div class="footer-socials">
                <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
        <p style="margin-top: 15px;">&copy; 2024 Mysore Events. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
